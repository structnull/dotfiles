# ---------------------------------------------------------
# hyprlock config
# ---------------------------------------------------------

$text_color            = rgba(ede0deFF)
$entry_background_color = rgba(130F0F11)
$entry_border_color     = rgba(a08c8955)
$entry_color            = rgba(d8c2bfFF)

$font_family       = Product Sans
$font_family_mono  = JetBrainsMono Nerd Font

# ---------------------------------------------------------
# Background
# ---------------------------------------------------------
background {
    monitor =
    path = screenshot
    color = rgba(130F0F77)

    blur_size = 4
    blur_passes = 4         # 0 disables blurring
    noise = 0.0117
    contrast = 1.3000       # vibrant!
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

# ---------------------------------------------------------
# Password field
# ---------------------------------------------------------
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.2          # scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.64      # scale of dots' absolute size, 0.0 - 1.0
    dots_center = true

    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $entry_color

    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    hide_input = false

    position = 0, 80
    halign = center
    valign = bottom
}

# ---------------------------------------------------------
# Clock
# ---------------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] echo "<b><big>$(date +'%H:%M:%S')</big></b>"
    color = $text_color
    font_size = 64
    font_family = $font_family_mono
    shadow_passes = 3
    shadow_size = 4

    position = 0, 16
    halign = center
    valign = center
}

# ---------------------------------------------------------
# Date
# ---------------------------------------------------------
label {
    monitor =
    text = cmd[update:18000000] echo "<b>$(date +'%A, %-d %B %Y')</b>"
    color = $text_color
    font_size = 24
    font_family = $font_family_mono
    shadow_passes = 3
    shadow_size = 3

    position = 0, 90
    halign = center
    valign = center
}

# ---------------------------------------------------------
# Greeting
# ---------------------------------------------------------
label {
    monitor =
    text = Hi <span text_transform="capitalize" size="larger">$USER</span> !!!
    color = $text_color
    font_size = 16
    font_family = $font_family
    shadow_passes = 2
    shadow_size = 2

    position = 0, -50
    halign = center
    valign = center
}

# ---------------------------------------------------------
# Status (top-left)
# ---------------------------------------------------------
label {
    monitor =
    text = cmd[update:5000] ~/.scripts/status.sh
    color = $text_color
    font_size = 14
    font_family = $font_family
    shadow_passes = 2
    shadow_size = 2

    position = 30, -30
    halign = left
    valign = top
}

# ---------------------------------------------------------
# Uptime (bottom-left, above the input field)
# ---------------------------------------------------------
label {
    monitor =
    text = cmd[update:60000] awk '{d=int($1/86400);h=int($1%86400/3600);m=int($1%3600/60);printf "  Up "; if(d>0)printf "%dd ",d; if(h>0||d>0)printf "%dh ",h; printf "%dm",m}' /proc/uptime
    color = $text_color
    font_size = 14
    font_family = $font_family_mono
    shadow_passes = 2
    shadow_size = 2

    position = 30, 30
    halign = left
    valign = bottom
}
